<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extras.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <nav class="month-switch" aria-label="Choose month">
        <button type="button" id="prev-month" class="btn ghost icon" aria-label="Previous month">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 id="month-label">Budget</h1>
        <button type="button" id="next-month" class="btn ghost icon" aria-label="Next month">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </nav>
      <div class="top-actions">
        <button type="button" id="btn-all" class="btn">All months</button>
        <button type="button" id="btn-import" class="btn primary" aria-label="Add bank file">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label-wide">Add bank file</span><span class="label-narrow" aria-hidden="true">Read file</span>
        </button>
        <div class="menu-wrap">
          <button type="button" id="btn-menu" class="btn icon" aria-haspopup="menu" aria-expanded="false" aria-label="More: backup, print, settings">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="3" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="13" cy="8" r="1.5" fill="currentColor"/></svg>
          </button>
          <div id="menu-root"></div>
        </div>
      </div>
    </header>
    <div id="banners"></div>
    <main>
      <div id="view-month"></div>
      <div id="all-months" hidden></div>
    </main>
  </div>

  <div id="popover-root" class="no-print"></div>
  <div id="dialog-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-box">Let go to read the file<span>ING statement (PDF) or ING download (CSV)</span></div>
  </div>
  <input type="file" id="file-input" accept=".pdf,.csv,.txt" multiple hidden>
  <noscript><p class="noscript">This app needs JavaScript. Turn on JavaScript in your browser.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/categorize.js"></script>
  <script src="js/import-csv.js"></script>
  <script src="js/import-pdf.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/import.js"></script>
  <script src="js/ui-month.js"></script>
  <script src="js/ui-extras.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
